<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Tuiutech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="Cabecario">
        <a href="index.html" class="logo-link">
            <img src="frc9604.png" alt="Tuiutech" class="logo-img"><span class="logo-nome">Tuiutech</span>
        </a>
        <div class="menu-container">
            <nav id="Menu">
                <ul>    
                    <li><a href="index.html">Home</a></li>    
                    <li><a href="Documentos.html">Documentos</a></li>   
                    <li><a href="Projetos.html">Projetos</a></li>     
                </ul>
            </nav>
            <div class="grupo-perfil">
                <div class="perfil-btn">JF</div>
                <a href="Login.html" class="btn-sair">Sair</a>
            </div>
        </div>
    </header>

    <main class="dashboard">

        <section class="secao-dashboard">
            <div class="cabecalho-secao">
                <h2>Chamada de hoje</h2>
                <span id="dataChamada" style="color: var(--texto-fraco); font-size: 15px;"></span>
            </div>
            <div class="bloco-docs bloco-chamada" id="blocoChamada">
                <div class="grupo-anexo">
                    <input type="text" id="inputCodigoChamada" class="input-login" placeholder="Código de 3 dígitos" inputmode="numeric" maxlength="3" style="max-width: 160px;">
                    <button class="btn-primario" id="btn-confirmar-chamada">Confirmar presença</button>
                </div>
                <p id="msgChamada" class="login-erro" role="alert"></p>
            </div>
        </section>

        <section class="secao-dashboard">
            <div class="cabecalho-secao">
                <h2 id="saudacao">Acesso rápido</h2>
            </div>
            <p class="subtitulo-secao">Escolha o módulo que deseja acessar para a equipe.</p>
            
            <div class="grid-cartoes">
                <!-- Cartão Único de Documentos -->
                <a href="Documentos.html" class="cartao-tl">
                    <div class="capa-cartao gradiente-1"></div>
                    <div class="info-cartao"><strong>Documentos</strong><span>Atas, listas e anotações da equipe</span></div>
                </a>

                <!-- Cartão Único do Kanban -->
                <a href="Projetos.html" class="cartao-tl">
                    <div class="capa-cartao gradiente-2"></div>
                    <div class="info-cartao"><strong>Projetos</strong><span>Quadros de tarefas e o que fazer no dia</span></div>
                </a>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
    <script>
    (async () => {
        const perfil = await window.pronto;
        if (!perfil) return;

        const bloco = document.getElementById('blocoChamada');
        const input = document.getElementById('inputCodigoChamada');
        const botao = document.getElementById('btn-confirmar-chamada');
        const msg = document.getElementById('msgChamada');

        function hojeISO() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        function formatarDataExtenso(dataISO) {
            const [ano, mes, dia] = dataISO.split('-').map(Number);
            const d = new Date(ano, mes - 1, dia);
            const texto = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            return texto.charAt(0).toUpperCase() + texto.slice(1);
        }
        const hoje = hojeISO();
        const elDataChamada = document.getElementById('dataChamada');
        if (elDataChamada) elDataChamada.textContent = formatarDataExtenso(hoje);

        function mostrarConfirmado() {
            bloco.innerHTML = '<p class="login-erro ok" style="margin:0;">✅ Presença confirmada hoje.</p>';
        }

        const { data: existente } = await db.from('presencas').select('id').eq('user_id', perfil.user_id).eq('data', hoje).maybeSingle();
        if (existente) { mostrarConfirmado(); return; }

        input.addEventListener('input', () => { input.value = input.value.replace(/\D/g, '').slice(0, 3); });

        botao.addEventListener('click', async () => {
            const codigo = input.value.trim();
            if (!/^[0-9]{3}$/.test(codigo)) { msg.textContent = 'Digite os 3 números do código.'; return; }

            botao.disabled = true;
            msg.textContent = '';
            try {
                const { data: { session } } = await db.auth.getSession();
                const resposta = await fetch(`${SUPABASE_URL}/functions/v1/confirmar-chamada`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${session.access_token}`
                    },
                    body: JSON.stringify({ codigo, data: hoje })
                });
                const resultado = await resposta.json();
                if (!resposta.ok || !resultado.ok) {
                    msg.textContent = resultado.erro || 'Código incorreto.';
                    return;
                }
                mostrarConfirmado();
            } catch (erro) {
                msg.textContent = 'Não foi possível confirmar agora. Tente de novo.';
            } finally {
                botao.disabled = false;
            }
        });
    })();
    </script>
</body>
</html>
